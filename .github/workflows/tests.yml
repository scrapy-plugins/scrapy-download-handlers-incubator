name: Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
    - '[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTEST_ADDOPTS: -n auto
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tox:
        - {python: "3.11", toxenv: py-all}
        - {python: "3.15", toxenv: py-all}
        - {python: "3.11", toxenv: py-pinned}
        - {python: "3.11", toxenv: py-pinned-noreactor}
        - {python: "3.15", toxenv: py-all-noreactor}
        include:
        - {os: ubuntu-latest, tox: {python: "3.15", toxenv: py-aiohttp}}
        - {os: ubuntu-latest, tox: {python: "3.15", toxenv: py-curlcffi}}
        - {os: ubuntu-latest, tox: {python: "3.15", toxenv: py-httpx}}
        - {os: ubuntu-latest, tox: {python: "3.15", toxenv: py-niquests}}
        - {os: ubuntu-latest, tox: {python: "3.15", toxenv: py-pyreqwest}}
        - {os: ubuntu-latest, tox: {python: "3.15", toxenv: py-wreq}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.tox.python }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.tox.python }}

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.toml

    - name: Install mitmproxy
      run: uv tool install --python 3.15 mitmproxy

    - name: Run tests
      env:
        TOXENV: ${{ matrix.tox.toxenv }}
        UV_PYTHON_PREFERENCE: only-system
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        report_type: test_results
