name: Tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
    - '[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTEST_ADDOPTS: -n auto
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tox:
        - {python: "3.10", toxenv: py-all}
        - {python: "3.11", toxenv: py-all}
        - {python: "3.12", toxenv: py-all}
        - {python: "3.13", toxenv: py-all}
        - {python: "3.14", toxenv: py-all}
        - {python: "3.15.0-rc.2", toxenv: py-all}
        - {python: "3.10", toxenv: py-pinned}
        - {python: "3.10", toxenv: py-pinned-noreactor}
        - {python: "3.14", toxenv: py-all-noreactor}
        include:
        - {os: ubuntu-latest, tox: {python: "3.14", toxenv: py-aiohttp}}
        - {os: ubuntu-latest, tox: {python: "3.14", toxenv: py-curlcffi}}
        - {os: ubuntu-latest, tox: {python: "3.14", toxenv: py-httpx}}
        - {os: ubuntu-latest, tox: {python: "3.14", toxenv: py-httpx2}}
        - {os: ubuntu-latest, tox: {python: "3.14", toxenv: py-niquests}}
        - {os: ubuntu-latest, tox: {python: "3.14", toxenv: py-pyreqwest}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.tox.python }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.tox.python }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.toml

    - name: Install mitmproxy
      run: uv tool install --python 3.14 mitmproxy

    - name: Run tests
      env:
        TOXENV: ${{ matrix.tox.toxenv }}
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        report_type: test_results
