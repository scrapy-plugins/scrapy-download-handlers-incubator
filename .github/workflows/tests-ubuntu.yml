name: Ubuntu

permissions:
  contents: read

on:
  push:
    branches:
    - main
    - '[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: -n auto
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-rc.1"]
        env:
          - TOXENV: py-all
        include:
          - python-version: '3.10'
            env:
              TOXENV: py-pinned
          - python-version: '3.10'
            env:
              TOXENV: py-pinned-noreactor
          - python-version: '3.14'
            env:
              TOXENV: py-all-noreactor
          - python-version: '3.14'
            env:
              TOXENV: py-aiohttp
          - python-version: '3.14'
            env:
              TOXENV: py-curlcffi
          - python-version: '3.14'
            env:
              TOXENV: py-httpx
          - python-version: '3.14'
            env:
              TOXENV: py-httpx2
          - python-version: '3.14'
            env:
              TOXENV: py-niquests
          - python-version: '3.14'
            env:
              TOXENV: py-pyreqwest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        cache-dependency-glob: |
          pyproject.toml
          tox.toml

    - name: Run tests
      env: ${{ matrix.env }}
      run: uvx --with tox-uv tox

    - name: Upload coverage report
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        report_type: test_results
