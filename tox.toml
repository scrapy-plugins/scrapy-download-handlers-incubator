requires = ["tox>=4.25"]
env_list = [
    { product = [["py"], ["aiohttp", "curlcffi", "httpx", "httpx2", "niquests", "pyreqwest", "all", "pinned"], ["", "noreactor"]] },
    "pre-commit",
    "typing",
    "twinecheck",
]

[env_run_base]
pass_env = [
    "PYTEST_ADDOPTS",
]
deps = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.7.0",
    "Twisted[http2]>=25.5.0",
    "mitmproxy>=11.0.2",
    { replace = "if", condition = "not factor.noreactor", then = ["pytest-twisted"], extend = true },
    { replace = "if", condition = "factor.noreactor", then = ["pytest-asyncio"], extend = true },
    { replace = "if", condition = "factor.pinned", then = [
        "Scrapy==2.17.0",
        "aiohttp==3.13.3",
        "curl_cffi==0.14.0",
        "httpx[http2,socks]==0.28.1",
        "niquests[socks]==3.20.0",
        "pyreqwest==0.11.0;python_version >= '3.11'",  # the easiest is to skip this on CI
    ], extend = true },
]
extras = [
    { replace = "if", condition = "factor.all or factor.aiohttp", then = ["aiohttp"], extend = true },
    { replace = "if", condition = "factor.all or factor.curlcffi", then = ["curl-cffi"], extend = true },
    { replace = "if", condition = "factor.httpx", then = ["httpx"], extend = true },
    { replace = "if", condition = "factor.all or factor.httpx2", then = ["httpx2"], extend = true },
    { replace = "if", condition = "factor.all or factor.niquests", then = ["niquests"], extend = true },
    { replace = "if", condition = "factor.all or factor.pyreqwest", then = ["pyreqwest"], extend = true },
]
commands = [
    [
        "pytest",
        { replace = "posargs", default = [
            "--cov-config=pyproject.toml",
            "--cov=scrapy_download_handlers_incubator",
            "--cov-report=term-missing",
            "--cov-report=xml",
            "--junitxml={env_name}.junit.xml",
            "-o",
            "junit_family=legacy",
            "--durations=10",
            "tests",
        ], extend = true },
        { replace = "if", condition = "not factor.noreactor", then = ["--reactor=asyncio"], extend = true },
    ],
]

[env.pre-commit]
deps = [
    "pre-commit",
]
commands = [
    ["pre-commit", "run", { replace = "posargs", default = ["--all-files"], extend = true }],
]

[env.mypy]
basepython = "python3.11"
deps = [
    "mypy==2.2.0",
    "aiohttp==3.14.1",
    "curl_cffi==0.15.0",
    "httpcore2==2.5.0",
    "httpx2[http2,socks]==2.5.0",
    "niquests==3.20.0",
    "pyreqwest==0.12.0",
    "pytest==9.1.1",
    "Scrapy==2.17.0",
    "Twisted==26.4.0",
]
commands = [
    ["mypy", { replace = "posargs", default = ["src", "tests"], extend = true }],
]

[env.twinecheck]
deps = [
    "twine==6.2.0",
    "build==1.5.0",
]
commands = [
    ["python", "-m", "build", "--sdist"],
    ["twine", "check", "dist/*"],
]
